<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grant Tracking System</title>
    <script
        src="https://unpkg.com/htmx.org@1.9.12"
        integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2"
        crossorigin="anonymous"
    ></script>
<style>
        :root {
            --accent: #2d5f8a;
            --accent-dark: #1e2327;
            --border: #e3e6ea;
            --text-muted: #6b7280;
            --bg: #f7f8fa;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background: var(--bg);
            color: #1e2327;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        header {
            background: var(--accent-dark);
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
        }
        header a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            margin-right: 24px;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.15s;
        }
        header a:hover { color: white; }
        main { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }
        h1 { font-size: 22px; font-weight: 700; margin: 0 0 20px; }
        h2 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
        h3 { font-size: 15px; font-weight: 700; margin: 0 0 12px; color: var(--accent-dark); }
        h4 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin: 20px 0 10px; }
        .card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 1px 2px rgba(16,24,40,0.04);
            margin-bottom: 16px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 10px;
            border: 1px solid #d3d8de;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(45,95,138,0.12);
        }
        label { font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.02em; }
        button {
            background: var(--accent-dark);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.15s, transform 0.05s;
        }
        button:hover { background: #30363c; }
        button:active { transform: translateY(1px); }
        button.htmx-request, button.htmx-request:hover {
            opacity: 0.6;
            cursor: wait;
        }
        button.htmx-request::after {
            content: "";
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-left: 6px;
            border: 2px solid rgba(255,255,255,0.5);
            border-top-color: white;
            border-radius: 50%;
            animation: htmx-spin 0.6s linear infinite;
            vertical-align: middle;
        }
        @keyframes htmx-spin {
            to { transform: rotate(360deg); }
        }
        button.secondary { background: #eceef1; color: #333; }
        button.secondary:hover { background: #e0e3e7; }
        button.danger { background: #c0392b; }
        button.danger:hover { background: #a93226; }
        .error { color: #c0392b; background: #fdecea; padding: 10px 14px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; border: 1px solid #f5c6c0; }
        .notice { color: #1a7f37; background: #e9f9ee; padding: 10px 14px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; border: 1px solid #bfe8cc; }
        .layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
        ul.scholar-list { list-style: none; padding: 0; margin: 0; max-height: 70vh; overflow-y: auto; }
        ul.scholar-list li a { display: block; padding: 9px 10px; border-radius: 6px; text-decoration: none; color: #222; font-size: 14px; transition: background 0.1s; }
        ul.scholar-list li a:hover { background: var(--bg); }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 8px; color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 2px solid var(--border); }
        td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
        tr:hover td { background: var(--bg); }
        .row-actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn-sm { padding: 3px 8px; font-size: 12px; }
        .stacked-item { padding: 3px 0; }
        .stacked-item:not(:last-child) { border-bottom: 1px dashed var(--border); }
        .section-divider { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
        .subform-divider { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
        .text-muted { color: var(--text-muted); }
        .text-muted-sm { color: var(--text-muted); font-size: 11px; }
        .stat-box {
            display: inline-block;
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px 26px;
            margin-right: 12px;
            box-shadow: 0 1px 2px rgba(16,24,40,0.04);
        }
        .stat-box .num { font-size: 30px; font-weight: 700; color: var(--accent-dark); line-height: 1.1; }
        /* Status pill styles */
        .status-pill {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            white-space: nowrap;
        }
        .status-active { background: #0EA5A4; }     /* calm teal */
        .status-pending { background: #F59E0B; }    /* amber */
        .status-completed { background: #10B981; }  /* green */
        .status-awarded { background: #10B981; }    /* green alias */
        .status-cancelled { background: #9CA3AF; }  /* gray */
        .status-on-hold { background: #F59E0B; }    /* amber */
        .status-withdrawn { background: #EF4444; }  /* red */
        .status-neutral { background: #9CA3AF; }    /* fallback gray */

    </style>
</head>
<body>
<header>
    <a href="/">Home</a>
    <a href="/scholars">Scholars</a>
    <a href="/dashboard">Dashboard</a>
</header>
<main>
    
<div class="layout">
    <div class="card">
        <button style="width:100%; margin-bottom:14px;" hx-get="/scholars/new" hx-target="#scholar-detail">
            + New Scholar
        </button>

        <input type="search" name="q" placeholder="Search by name..." value=""
               style="margin-bottom:8px;"
               hx-get="/scholars/list" hx-trigger="input changed delay:300ms" hx-target="#scholar-list"
               hx-include="#year-filter" hx-vals='{"offset": 0}'>

        <select id="year-filter" name="year" style="margin-bottom:10px;"
                hx-get="/scholars/list" hx-trigger="change" hx-target="#scholar-list"
                hx-include="[name='q']" hx-vals='{"offset": 0}'>
            <option value="" selected>All years</option>
            
            <option value="2026" >2026</option>
            
            <option value="2025" >2025</option>
            
            <option value="2024" >2024</option>
            
            <option value="2023" >2023</option>
            
            <option value="2022" >2022</option>
            
            <option value="2021" >2021</option>
            
            <option value="2020" >2020</option>
            
            <option value="2019" >2019</option>
            
            <option value="2015" >2015</option>
            
            <option value="1900" >1900</option>
            
        </select>

        <div style="font-size:12px; color:#888; padding-bottom:8px; margin-bottom:6px; border-bottom:1px solid var(--border, #e3e6ea);">
            5 scholar(s)
        </div>
        <ul class="scholar-list" id="scholar-list"
            hx-trigger="scholar-changed from:body" hx-get="/scholars/list"
            hx-include="[name='q'], #year-filter" hx-vals='{"offset": 0}'>
            

<li>
    <a href="#" hx-get="/scholars/12" hx-target="#scholar-detail">
        Angela Reyes
    </a>
</li>

<li>
    <a href="#" hx-get="/scholars/11" hx-target="#scholar-detail">
        Juan Dela Cruz
    </a>
</li>

<li>
    <a href="#" hx-get="/scholars/10" hx-target="#scholar-detail">
        Maria Santos
    </a>
</li>

<li>
    <a href="#" hx-get="/scholars/13" hx-target="#scholar-detail">
        Ramon Villanueva
    </a>
</li>

<li>
    <a href="#" hx-get="/scholars/14" hx-target="#scholar-detail">
        Rodian Marin
    </a>
</li>




        </ul>
    </div>
    <div class="card" id="scholar-detail">
        
        



<h2>New Scholar</h2>
<form hx-post="/scholars" hx-target="#scholar-detail">
    <label>Name *</label>
    <input name="name" required>
    <label>Age</label>
    <input name="age" type="number">
    <label>Previous Degree</label>
    <input name="previous_degree">
    <label style="display:flex; align-items:center; gap:6px; text-transform:none; font-size:13px; margin-top:14px;">
        <input type="checkbox" name="missing_requirements" value="true" style="width:auto; margin:0;"> Missing Requirements
    </label>

    <h4>Initial Department Assignment (optional)</h4>
    <label>Department</label>
    <input name="department">
    <label>Rank</label>
    <input name="rank">
    <label>Tenure</label>
    <input name="tenure">
    <label>Started</label>
    <input name="date_started" type="date">
    <label>Ended</label>
    <input name="date_ended" type="date">

    <div class="row-actions">
        <button type="submit">Add Scholar</button>
    </div>
</form>


        
    </div>
</div>

</main>
</body>
</html>
