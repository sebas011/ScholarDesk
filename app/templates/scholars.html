{% extends "base.html" %}
{% block content %}
<div class="layout">
    <div class="card">
        <input type="search" name="q" placeholder="Search by name..." value="{{ q }}"
               hx-get="/scholars/list" hx-trigger="input changed delay:300ms" hx-target="#scholar-list"
               hx-include="#year-filter" hx-vals='{"offset": 0}'>

        <label style="margin-top:0;">School year</label>
        <select id="year-filter" name="year"
                hx-get="/scholars/list" hx-trigger="change" hx-target="#scholar-list"
                hx-include="[name='q']" hx-vals='{"offset": 0}'>
            <option value="" {% if not year %}selected{% endif %}>All years</option>
            {% for y in available_years %}
            <option value="{{ y }}" {% if y == year %}selected{% endif %}>{{ y }}</option>
            {% endfor %}
        </select>

        <button style="width:100%; margin-bottom:10px;" hx-get="/scholars/new" hx-target="#scholar-detail">
            + New Scholar
        </button>
        <div style="font-size:12px; color:#888; margin-bottom:6px;">{{ total }} scholar(s)</div>
        <ul class="scholar-list" id="scholar-list"
            hx-trigger="scholar-changed from:body" hx-get="/scholars/list"
            hx-include="[name='q'], #year-filter" hx-vals='{"offset": 0}'>
            {% include "partials/scholar_list.html" %}
        </ul>
    </div>
    <div class="card" id="scholar-detail">
        {% include "partials/scholar_detail.html" %}
    </div>
</div>
{% endblock %}
