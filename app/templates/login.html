{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto pt-16">
    <section class="card p-7">
        <h1 class="text-2xl font-bold text-navy-900">Sign in to ScholarDesk</h1>
        <p class="text-sm text-slate-500 mt-2 mb-6">Use your local administrator account.</p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
            <input type="hidden" name="next" value="{{ next }}">
            <div>
                <label class="form-label" for="username">Username</label>
                <input id="username" name="username" value="{{ username }}" autocomplete="username" required class="form-input">
            </div>
            <div>
                <label class="form-label" for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required class="form-input">
            </div>
            <button type="submit" class="btn btn-primary w-full">Sign in</button>
        </form>
    </section>
</div>
{% endblock %}
