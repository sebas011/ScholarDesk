{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-navy-900">Choose a system</h1>
        <p class="text-sm text-slate-500 mt-1">Pick which system you'd like to open.</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <a href="/home" class="card p-6 hover:shadow-md transition-shadow block">
            <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center mb-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            <h2 class="font-bold text-navy-900 mb-1">Scholar & Grant Tracking</h2>
            <p class="text-sm text-slate-500">Scholars, department assignments, and grants.</p>
        </a>
        <a href="/payroll" class="card p-6 hover:shadow-md transition-shadow block">
            <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center mb-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>

            <h2 class="font-bold text-navy-900 mb-1">Faculty Workload & Payroll</h2>
            <p class="text-sm text-slate-500">Overload reconciliation and payroll exports.</p>
        </a>
    </div>
</div>
{% endblock %}
