{% if error %}
<tr>
    <td colspan="8" class="py-0">
        <div class="alert alert-error my-2 mx-3">{{ error }}</div>
    </td>
</tr>
{% endif %}
<tr id="grant-row-{{ grant.id }}" class="bg-indigo-50/40">
    <td class="py-2 px-3"><input name="program_applied" value="{{ grant.program_applied }}" required class="form-input form-input-sm"></td>
    <td class="py-2 px-3"><input name="type_of_grant" value="{{ grant.type_of_grant or '' }}" class="form-input form-input-sm"></td>
    <td class="py-2 px-3"><input name="delivering_hei" value="{{ grant.delivering_hei or '' }}" class="form-input form-input-sm"></td>
    <td class="py-2 px-3"><input name="date_started" value="{{ grant.date_started or '' }}" placeholder="rough estimate OK" class="form-input form-input-sm"></td>
    <td class="py-2 px-3"><input name="date_ended" value="{{ grant.date_ended or '' }}" placeholder="rough estimate OK" class="form-input form-input-sm"></td>
    <td class="py-2 px-3">
        <select name="status" class="form-input form-input-sm form-select">
            {% for s in ["Active", "Completed", "Cancelled", "Pending", "On Hold", "Withdrawn"] %}
            <option {% if s == grant.status %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </td>
    <td class="py-2 px-3"><input name="extension" value="{{ grant.extension or '' }}" class="form-input form-input-sm"></td>
    <td class="py-2 px-3 text-right whitespace-nowrap">
        <div class="flex items-center gap-2 justify-end">
            <input name="start_year" type="number" min="1900" max="2100" value="{{ grant.start_year or '' }}"
                   placeholder="Start yr" class="form-input form-input-sm w-20" required>
            <input name="end_year" type="number" min="1900" max="2100" value="{{ grant.end_year or '' }}"
                   placeholder="End yr" class="form-input form-input-sm w-20">
            <button type="button" class="btn btn-primary btn-sm"
                    hx-post="/grants/{{ grant.id }}?scholar_id={{ scholar_id }}"
                    hx-include="#grant-row-{{ grant.id }} input, #grant-row-{{ grant.id }} select"
                    hx-target="#scholar-detail">
                <span class="btn-spinner"></span>
                Save
            </button>
            <button type="button" class="btn btn-secondary btn-sm"
                    hx-get="/scholars/{{ scholar_id }}" hx-target="#scholar-detail">Cancel</button>
        </div>
    </td>
</tr>
