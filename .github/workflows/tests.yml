name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependency integrity
        run: python -m pip check

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with coverage
        run: pytest -v --cov=app --cov-report=term-missing

  portable-build:
    name: Windows portable build
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Create isolated build environment
        run: python -m venv .venv

      - name: Install Windows build dependencies
        run: .\.venv\Scripts\python.exe -m pip install -r requirements.windows.txt

      - name: Build portable release
        run: cmd /c build.bat

      - name: Smoke test packaged release
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $env:RUNNER_TEMP "scholardesk-release-smoke"
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null
          Copy-Item .\dist\* $releaseDirectory

          $adminHelp = & (Join-Path $releaseDirectory "ScholarDeskAdmin.exe") --help 2>&1
          if ($LASTEXITCODE -ne 0 -or $adminHelp -notmatch "--list-users" -or $adminHelp -notmatch "--remove-user") {
            throw "Packaged ScholarDeskAdmin help or account-management commands are unavailable."
          }

          $password = "release-smoke-password"
          $passwordHash = & .\.venv\Scripts\python.exe -c "from app.core.auth import hash_password; print(hash_password('$password'))"
          @(
            "username=release-smoke"
            "password_hash=$passwordHash"
          ) | Set-Content -Path (Join-Path $releaseDirectory "auth.txt")

          $previousHeadlessMode = $env:SCHOLARDESK_HEADLESS
          $env:SCHOLARDESK_HEADLESS = "1"
          $process = $null
          try {
            $process = Start-Process -FilePath (Join-Path $releaseDirectory "ScholarDesk.exe") -WorkingDirectory $releaseDirectory -WindowStyle Hidden -PassThru
            $authorization = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("release-smoke:$password"))
            $headers = @{ Authorization = "Basic $authorization" }
            $deadline = (Get-Date).AddSeconds(20)
            $response = $null
            do {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000/health" -Headers $headers
              } catch {
                Start-Sleep -Milliseconds 250
              }
            } until ($response.StatusCode -eq 200 -or (Get-Date) -ge $deadline)

            if ($response.StatusCode -ne 200) {
              throw "Packaged ScholarDesk health check did not become ready within 20 seconds."
            }
            if (-not (Test-Path (Join-Path $releaseDirectory "grants.db"))) {
              throw "Packaged ScholarDesk did not create grants.db in the clean release directory."
            }
          } finally {
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
            $env:SCHOLARDESK_HEADLESS = $previousHeadlessMode
          }

      - name: Upload portable executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ScholarDesk-windows-${{ github.sha }}
          path: |
            dist/ScholarDesk.exe
            dist/ScholarDeskAdmin.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
