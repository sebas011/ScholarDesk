name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Check dependency integrity
        run: python -m pip check

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.lock.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with coverage
        run: pytest -v --cov=app --cov-report=term-missing