name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependency integrity
        run: python -m pip check

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with coverage
        run: pytest -v --cov=app --cov-report=term-missing

  portable-build:
    name: Windows portable build
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Create isolated build environment
        run: python -m venv .venv

      - name: Install locked dependencies
        run: .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Build portable release
        run: cmd /c build.bat

      - name: Upload portable executables
        uses: actions/upload-artifact@v7
        with:
          name: ScholarDesk-windows-${{ github.sha }}
          path: |
            dist/ScholarDesk.exe
            dist/ScholarDeskAdmin.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
